name: Check

on:
  push:
  pull_request:

jobs:
  check:
    name: Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      # --ignore-scripts skips the prepare script, and eslint needs the generated tsconfig
      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Format check
        run: bun prettier --check .

      - name: Lint
        run: bun eslint .

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run coverage

      - name: Build
        run: bun run build

      - name: Size check
        run: bun run size

      # Last, so an external Sonar problem can never hide a broken build
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
